<div class="search-container">
    <!-- Two-way binding con model(): el valor se sincroniza con el padre -->
    <!-- Event Binding (input): actualizamos el model cuando el usuario escribe -->
    <input 
    type="text" 
    [value]="termino()" 
    (input)="termino.set($any($event.target).value)"
    maxlength="35"
    placeholder="🔍 Buscar películas"
    class="search-input"
    >
    @if (termino()) {
    <button (click)="limpiar()" class="clear-btn">Cancelar</button>
    }
</div>
