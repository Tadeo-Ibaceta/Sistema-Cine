<div class="auth-container">
    <h2>Crear cuenta</h2>    
    <div class="auth-card">
    
        <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
        
        <div class="form-group">
            <label for="email">Correo electrónico</label>
            <input id="email" type="email" formControlName="email" placeholder="tu@email.com">
        </div>

        <div class="form-group">
            <label for="password">Contraseña</label>
            <input id="password" type="password" formControlName="password" placeholder="******">
        </div>

        <div class="form-group">
            <label for="firstName">Nombre</label>
            <input id="firstName" type="text" formControlName="firstName" />
        </div>

        <div class="form-group">
            <label for="lastName">Apellido</label>
            <input id="lastName" type="text" formControlName="lastName" />
        </div>

        <div class="form-group">
            <label for="birthDate">Fecha de Nacimiento</label>
            <input id="birthDate" type="date" formControlName="birthDate" />
        </div>

        <div class="form-group">
            <label for="bloodType">Tipo de Sangre</label>
            <select id="bloodType" formControlName="bloodType">
            <option value="" disabled selected>Selecciona una opción</option>
            <option value="A+">A+</option>
            <option value="A-">A-</option>
            <option value="B+">B+</option>
            <option value="B-">B-</option>
            <option value="AB+">AB+</option>
            <option value="AB-">AB-</option>
            <option value="O+">O+</option>
            <option value="O-">O-</option>
            </select>
        </div>

        <div class="form-group">
            <label for="eyeColor">Color de Ojos</label>
            <input id="eyeColor" type="text" formControlName="eyeColor" placeholder="Ej: Marrón" />
        </div>

        <div class="form-group">
            <label for="vacationDays">Días de Vacaciones por Año</label>
            <input id="vacationDays" type="number" formControlName="vacationDays" min="0" max= 365/>
        </div>

        @if (errorMessage()) {
            <div class="error-msg">{{ errorMessage() }}</div>
        }

        @if (successMessage()) {
            <div class="success-msg">{{ successMessage() }}</div>
        }

        <button type="submit" [disabled]="registerForm.invalid || isLoading()">
            {{ isLoading() ? 'Registrando...' : 'Registrarse' }}
        </button>
        </form>
    
        
    </div>
    <p class="auth-link">¿Ya tienes una cuenta? <a routerLink="/login">Inicia sesión acá</a></p>
</div>
